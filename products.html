<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục đồ điện tử</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        input, select {
            padding: 8px;
            font-size: 14px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .price {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>📱 Danh mục đồ điện tử</h1>

<div class="controls">
    <!-- Tìm kiếm -->
    <input type="text" id="search" placeholder="🔍 Tìm sản phẩm...">

    <!-- Lọc loại -->
    <select id="category">
        <option value="">Tất cả loại</option>
        <option value="phone">Điện thoại</option>
        <option value="laptop">Laptop</option>
        <option value="accessory">Phụ kiện</option>
    </select>

    <!-- Lọc giá -->
    <select id="price">
        <option value="">Tất cả giá</option>
        <option value="low">Dưới 5 triệu</option>
        <option value="mid">5 - 15 triệu</option>
        <option value="high">Trên 15 triệu</option>
    </select>
</div>

<div class="products" id="productList"></div>

<script>
const products = [
    {name: "iPhone 13", price: 15000000, category: "phone", img: "https://via.placeholder.com/200"},
    {name: "Samsung Galaxy S22", price: 12000000, category: "phone", img: "https://via.placeholder.com/200"},
    {name: "Laptop Dell XPS", price: 25000000, category: "laptop", img: "https://via.placeholder.com/200"},
    {name: "MacBook Air M1", price: 20000000, category: "laptop", img: "https://via.placeholder.com/200"},
    {name: "Tai nghe Bluetooth", price: 2000000, category: "accessory", img: "https://via.placeholder.com/200"},
    {name: "Chuột gaming", price: 800000, category: "accessory", img: "https://via.placeholder.com/200"}
];

const productList = document.getElementById("productList");

function displayProducts(list) {
    productList.innerHTML = "";
    list.forEach(p => {
        productList.innerHTML += `
            <div class="product">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p class="price">${p.price.toLocaleString()} VND</p>
            </div>
        `;
    });
}

function filterProducts() {
    let search = document.getElementById("search").value.toLowerCase();
    let category = document.getElementById("category").value;
    let price = document.getElementById("price").value;

    let filtered = products.filter(p => {
        let matchSearch = p.name.toLowerCase().includes(search);
        let matchCategory = category === "" || p.category === category;

        let matchPrice = true;
        if (price === "low") matchPrice = p.price < 5000000;
        if (price === "mid") matchPrice = p.price >= 5000000 && p.price <= 15000000;
        if (price === "high") matchPrice = p.price > 15000000;

        return matchSearch && matchCategory && matchPrice;
    });

    displayProducts(filtered);
}

document.getElementById("search").addEventListener("input", filterProducts);
document.getElementById("category").addEventListener("change", filterProducts);
document.getElementById("price").addEventListener("change", filterProducts);

// Hiển thị ban đầu
displayProducts(products);
</script>

</body>
</html>
