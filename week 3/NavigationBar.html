<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Navigation Bar</title>

    <style>
        body{
            margin:0;
        }

        nav#topmenu{
            background-color:#444;
        }

        nav#topmenu ul{
            list-style:none;
            margin:0;
            padding:0;
        }

        nav#topmenu li{
            display:inline-block;
            line-height:40px;
            height:40px;
        }

        nav#topmenu a{
            text-decoration:none;
            color:white;
            padding:20px;
            font-size:24px;
        }
    </style>

</head>

<body>

<nav id="topmenu">
<ul>

<li><a href="#">Home</a></li>
<li><a href="#">Tutorials</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Newsletter</a></li>
<li><a href="#">Contact</a></li>

</ul>
</nav>

</body>
</html>
