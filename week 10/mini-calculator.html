<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mini calculator</title>
    <script language="javascript">
        function calculate() {
            // Lấy các phần tử từ form
            var a = document.frmCal.txta;
            var b = document.frmCal.txtb;
            var o = document.frmCal.slto;
            var r = document.frmCal.txtr;

            // Biểu thức chính quy kiểm tra định dạng số (số nguyên hoặc số thập phân)
            var numberFormat = /^[+-]?\d+(\.\d+)?$/;

            // 1. Kiểm tra a có phải là số không
            if (numberFormat.test(a.value) == false) {
                alert("a must be a number!");
                a.focus();
            } 
            // 2. Kiểm tra b có phải là số không
            else if (numberFormat.test(b.value) == false) {
                alert("b must be a number!");
                b.focus();
            } 
            // 3. Kiểm tra lỗi chia cho 0 (cho cả phép chia / và phép chia lấy dư %)
            else if ((o.value == "/" || o.value == "%") && parseFloat(b.value) == 0) {
                alert("b can't be 0!");
                r.value = "";
                b.focus();
            } 
            // 4. Nếu mọi thứ hợp lệ thì tính toán
            else {
                r.value = eval(a.value + o.value + b.value);
            }
        }
    </script>
</head>
<body>
    <form name="frmCal">
        <table border="0" align="center">
            <tr>
                <td colspan="2" align="center">
                    <h2>MINI CALCULATOR</h2>
                </td>
            </tr>
            <tr>
                <td align="right">a = </td>
                <td><input name="txta" type="text" size="20"></td>
            </tr>
            <tr>
                <td align="right">b = </td>
                <td><input name="txtb" type="text" size="20"></td>
            </tr>
            <tr>
                <td align="right">Operator: </td>
                <td>
                    <select name="slto">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                        <option value="%">%</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td align="right">Result: </td>
                <td><input name="txtr" readonly type="text" size="20"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" value="Calculate" onClick="calculate()">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
